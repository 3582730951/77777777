<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>在线聊天 · LLM Pool</title>
<link rel="stylesheet" href="/static/app.css?v=8">
<style>
.remote-layout{display:block;width:100%;margin:0}
.chat-shell,.chat-shell.work-surface{height:min(860px,calc(100vh - 126px));min-height:660px;display:flex;flex-direction:column}
.chat-log{flex:1;overflow:auto;padding:14px;background:var(--bg);border-bottom:1px solid var(--hairline)}
.msg{max-width:82%;margin:0 0 12px;padding:10px 12px;border-radius:12px;border:1px solid var(--hairline);
  line-height:1.6;font-size:14px;white-space:pre-wrap;word-break:break-word}
.msg.user{margin-left:auto;background:var(--accent);color:#fff;border-color:transparent}
.msg.assistant{background:var(--bg-elev);color:var(--fg)}
.msg.error{background:rgba(255,69,58,.12);color:var(--err)}
.chat-compose{padding:12px;display:flex;flex-direction:column;gap:10px}
.chat-row{display:grid;grid-template-columns:1fr 160px;gap:10px}
.chat-tools{display:grid;grid-template-columns:minmax(260px,1.25fr) minmax(180px,.9fr) minmax(180px,.9fr);gap:10px}
@media(max-width:760px){.chat-row,.chat-tools{grid-template-columns:1fr}.msg{max-width:94%}}
.account-inline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.account-inline .btn{height:34px;white-space:nowrap}
.field-help{min-height:15px;font-size:11px;color:var(--fg-muted)}
.endpoint-line{display:flex;gap:8px;align-items:center;min-width:0}
.endpoint-line code{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body class="theme-auto">
<div class="app">
  {{template "_sidebar" .}}
  <main class="main">
    <header class="topbar">
      <div class="topbar-title">在线聊天</div>
      <div class="topbar-actions">
        <div class="endpoint-line">
          <span class="tiny muted">Gateway</span>
          <code class="tiny" id="gateway-url">{{.GatewayURL}}</code>
          <button class="btn ghost sm" onclick="copyText('{{.GatewayURL}}','Gateway 地址')">复制</button>
        </div>
        {{template "_topbar_ctrl" (dict "Lang" .Lang "BackURL" "/remote-chat")}}
      </div>
    </header>

    <div class="content">
      {{if .Error}}
      <div class="alert alert-err">{{.Error}}</div>
      {{end}}

      <div class="remote-layout">
        <div class="card chat-shell work-surface">
          <div class="card-header">
            <div>
              <div class="card-title">网页聊天</div>
              <div class="tiny muted">直接调用 Gateway 聊天链路</div>
            </div>
            <button class="btn ghost sm" type="button" onclick="clearChat()">清空</button>
          </div>
          <div id="chat-log" class="chat-log">
            <div class="msg assistant">选择响应账号和 API Key，输入消息即可开始验证。</div>
          </div>
          <form id="chat-form" class="chat-compose">
            <div class="chat-tools">
              <div class="field account-select-field">
                <label for="remote-chat-account-id">响应账号</label>
                <div class="account-inline">
                  <select id="remote-chat-account-id" name="account_id" aria-label="选择响应账号">
                    <option value="">选择账号</option>
                    {{range .Accounts}}
                    <option value="{{.ID}}" {{if eq .ID $.Config.AccountID}}selected{{end}}>[{{.Provider}}] {{.ID}} · {{.StatusLabel}}</option>
                    {{end}}
                  </select>
                  <button id="remote-chat-account-save" class="btn ghost sm" type="button" onclick="saveRemoteChatAccount()">保存</button>
                </div>
                <div class="field-help">第三方测试前先指定本次响应账号。</div>
              </div>
              <div class="field">
                <label for="api-key-select">API Key</label>
                <select id="api-key-select">
                  {{range .APIKeys}}
                  <option value="{{.Value}}">[{{.Source}}] {{.GroupID}} / {{or .Provider "provider"}} {{if .Label}}· {{.Label}}{{end}}</option>
                  {{end}}
                </select>
              </div>
              <div class="field">
                <label for="api-key-manual">手动 Key</label>
                <input id="api-key-manual" type="text" placeholder="sk-pool-..." autocomplete="off">
              </div>
            </div>
            <div class="chat-row">
              <div class="field">
                <label for="chat-model">模型</label>
                <input id="chat-model" type="text" list="model-list" value="{{if .SuggestedModels}}{{index .SuggestedModels 0}}{{end}}" placeholder="留空使用账号默认模型">
                <datalist id="model-list">
                  {{range .SuggestedModels}}<option value="{{.}}"></option>{{end}}
                </datalist>
              </div>
              <div class="field">
                <label for="chat-stream">流式输出</label>
                <select id="chat-stream">
                  <option value="true">开启</option>
                  <option value="false">关闭</option>
                </select>
              </div>
            </div>
            <div class="field">
              <label for="chat-message">消息</label>
              <textarea id="chat-message" rows="4" placeholder="输入要发送给模型的内容"></textarea>
            </div>
            <div class="form-actions">
              <button id="send-btn" class="btn primary" type="submit">发送</button>
              <button class="btn ghost" type="button" onclick="document.getElementById('chat-message').value=''">清空输入</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>
</div>

<div id="toast-ct"></div>
<script>
const gatewayURL = '{{.GatewayURL}}';
let hasConfiguredAccount = {{if .Config.Account}}true{{else}}false{{end}};
let configuredAccountID = {{printf "%q" .Config.AccountID}};
const chatLog = document.getElementById('chat-log');
const form = document.getElementById('chat-form');
const sendBtn = document.getElementById('send-btn');

function showToast(m){
  const c=document.getElementById('toast-ct');
  if(!c)return;
  const t=document.createElement('div');t.className='toast';t.textContent=m;
  c.appendChild(t);setTimeout(()=>t.remove(),2500);
}
function addMessage(role,text){
  const el=document.createElement('div');
  el.className='msg '+role;
  el.textContent=text||'';
  chatLog.appendChild(el);
  chatLog.scrollTop=chatLog.scrollHeight;
  return el;
}
function clearChat(){
  chatLog.innerHTML='';
  addMessage('assistant','已清空。');
}
function selectedAPIKey(){
  const manual=document.getElementById('api-key-manual').value.trim();
  if(manual)return manual;
  return (document.getElementById('api-key-select').value||'').trim();
}
function selectedRemoteChatAccountID(){
  const el=document.getElementById('remote-chat-account-id');
  return el?(el.value||'').trim():'';
}
function setAccountSaveBusy(busy){
  const btn=document.getElementById('remote-chat-account-save');
  if(!btn)return;
  btn.disabled=busy;
  btn.textContent=busy?'保存中':'保存';
}
async function saveRemoteChatAccount(){
  const accountID=selectedRemoteChatAccountID();
  setAccountSaveBusy(true);
  try{
    const opts={method:accountID?'PUT':'DELETE',headers:{'Content-Type':'application/json'}};
    if(accountID)opts.body=JSON.stringify({account_id:accountID});
    const resp=await fetch('/api/admin/remote-chat/config',opts);
    let data={};
    try{data=await resp.json();}catch{}
    if(!resp.ok)throw new Error(data.error||'账号配置保存失败');
    configuredAccountID=accountID;
    hasConfiguredAccount=!!accountID;
    showToast(accountID?'响应账号已保存':'响应账号已清除');
    return true;
  }catch(err){
    addMessage('error',err&&err.message?err.message:String(err));
    return false;
  }finally{
    setAccountSaveBusy(false);
  }
}
async function ensureRemoteChatAccount(){
  const accountID=selectedRemoteChatAccountID();
  if(!accountID){
    addMessage('error','请选择响应账号。');
    return false;
  }
  if(!hasConfiguredAccount||accountID!==configuredAccountID){
    return await saveRemoteChatAccount();
  }
  return true;
}
function appendAssistantText(el,text){
  el.textContent += text;
  chatLog.scrollTop=chatLog.scrollHeight;
}
async function readSSE(resp, assistantEl){
  const reader=resp.body.getReader();
  const decoder=new TextDecoder();
  let buf='';
  for(;;){
    const {value,done}=await reader.read();
    if(done)break;
    buf += decoder.decode(value,{stream:true});
    const chunks=buf.split('\n\n');
    buf=chunks.pop()||'';
    for(const chunk of chunks){
      const lines=chunk.split('\n').filter(line=>line.startsWith('data:'));
      for(const line of lines){
        const data=line.slice(5).trim();
        if(!data||data==='[DONE]')continue;
        try{
          const obj=JSON.parse(data);
          const choice=(obj.choices&&obj.choices[0])||{};
          const delta=(choice.delta&&choice.delta.content)||'';
          const message=(choice.message&&choice.message.content)||'';
          if(delta)appendAssistantText(assistantEl,delta);
          if(message&&!assistantEl.textContent)appendAssistantText(assistantEl,message);
        }catch{}
      }
    }
  }
}
form.addEventListener('submit',async e=>{
  e.preventDefault();
  const message=document.getElementById('chat-message').value.trim();
  const key=selectedAPIKey();
  const stream=document.getElementById('chat-stream').value==='true';
  const model=document.getElementById('chat-model').value.trim();
  if(!(await ensureRemoteChatAccount()))return;
  if(!key){addMessage('error','请选择或填写 API Key。');return;}
  if(!message){return;}
  addMessage('user',message);
  document.getElementById('chat-message').value='';
  const assistantEl=addMessage('assistant','');
  sendBtn.disabled=true;
  try{
    const payload={message,stream};
    if(model)payload.model=model;
    const resp=await fetch(gatewayURL+'/v1/remote-chat',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify(payload)
    });
    if(!resp.ok){
      const text=await resp.text();
      assistantEl.className='msg error';
      assistantEl.textContent='请求失败：'+resp.status+' '+text;
      return;
    }
    if(stream && resp.body){
      await readSSE(resp,assistantEl);
    }else{
      const data=await resp.json();
      const text=data?.choices?.[0]?.message?.content || JSON.stringify(data);
      assistantEl.textContent=text;
    }
    if(!assistantEl.textContent)assistantEl.textContent='[无内容]';
  }catch(err){
    assistantEl.className='msg error';
    assistantEl.textContent='请求失败：'+(err&&err.message?err.message:String(err));
  }finally{
    sendBtn.disabled=false;
  }
});
</script>
{{template "_copy_script" .}}
</body></html>
