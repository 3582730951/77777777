<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · LLM Pool</title>
<link rel="stylesheet" href="/static/app.css?v=8">
</head>
<body class="theme-dark mesh-bg">
<div class="login-wrap">
  <div class="login-card">
    <div class="logo-lg"></div>
    <div>
      <div class="login-title">管理员登录</div>
      <div class="login-sub mt-4">LLM Pool Admin</div>
    </div>
    {{if .Error}}
    <div class="alert alert-err w-full">{{.Error}}</div>
    {{end}}
    <form method="post" action="/login" class="login-form">
      <div class="field">
        <label for="admin-login-username">用户名</label>
        <input id="admin-login-username" type="text" name="username" placeholder="admin" autocomplete="username" autofocus/>
      </div>
      <div class="field">
        <label for="admin-login-password">密码</label>
        <input id="admin-login-password" type="password" name="password" placeholder="••••••••" autocomplete="current-password"/>
      </div>
      <button type="submit" class="btn primary lg w-full" style="margin-top:4px">登录</button>
    </form>
  </div>
</div>

</body></html>
