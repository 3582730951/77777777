version: "3.8"
services:
  llm-pool:
    image: llm-pool:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: llm-pool
    restart: unless-stopped
    environment:
      POOL_MASTER_KEY: ${POOL_MASTER_KEY:-please-change-this-master-key}
      PROVIDER_MODE: ${PROVIDER_MODE:-mock}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data:/data
      - ./config:/config
    ports:
      - "127.0.0.1:8787:8787"
      - "127.0.0.1:8788:8788"
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
